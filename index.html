<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Activity">
<link rel="manifest" href="/habits/manifest.json">
<title>Activity</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  :root {
    --side-pad: 5vw;
    --font: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    --row-h: 8vh;
    --col-w: 11vw;
    --box-size: 4.8vw;
    --font-main: 4.2vw;
    --font-small: 3.2vw;
    --font-tiny: 2.4vw;
    --nav-h: 7vh;
    --bottom-row-h: 5.5vh;
  }
  html, body { width: 100%; height: 100%; background: #000; color: #fff; font-family: var(--font); overflow: hidden; }
  .app { display: flex; flex-direction: column; width: 100%; height: 100%; padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); background: #000; }
  .status-bar { display: flex; justify-content: space-between; align-items: center; padding: 1.2vh var(--side-pad) 0.5vh; flex-shrink: 0; }
  .status-date { font-size: var(--font-tiny); font-weight: 500; color: #555; letter-spacing: 0.06em; text-transform: uppercase; }
  .status-icons { font-size: var(--font-tiny); color: #555; }
  .content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

  .view { display: none; flex-direction: column; flex: 1; overflow: hidden; }
  .view.active { display: flex; }

  .nav-row { display: flex; justify-content: space-between; align-items: center; height: var(--nav-h); padding: 0 var(--side-pad); border-bottom: 0.5px solid #1c1c1c; flex-shrink: 0; }
  .nav-item { font-size: calc(var(--font-main) * 1.4); font-weight: 700; letter-spacing: -0.02em; color: #2a2a2a; cursor: pointer; user-select: none; }
  .nav-item.active { color: #fff; }

  .day-header { display: flex; align-items: center; padding: 1vh var(--side-pad) 0.8vh; border-bottom: 0.5px solid #1a1a1a; flex-shrink: 0; }
  .day-header-spacer { flex: 1; }
  .day-col-hdr { width: var(--col-w); text-align: center; font-size: var(--font-tiny); color: #555; letter-spacing: 0.05em; text-transform: uppercase; flex-shrink: 0; }
  .day-col-hdr.today-col { color: #888; }

  .habit-list { flex: 1; display: flex; flex-direction: column; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .habit-row { display: flex; align-items: center; padding: 0 var(--side-pad); height: var(--row-h); border-bottom: 0.5px solid #111; flex-shrink: 0; }
  .habit-row:last-child { border-bottom: none; }
  .habit-name { flex: 1; font-size: var(--font-main); font-weight: 600; letter-spacing: -0.01em; color: #bbb; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pencil { font-size: calc(var(--font-small) * 0.95); color: #666; cursor: pointer; padding: 0 2vw 0 1vw; flex-shrink: 0; user-select: none; }
  .pencil:active { color: #aaa; }
  .day-cell { width: var(--col-w); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .day-box { width: var(--box-size); height: var(--box-size); border: 0.5px solid #777; border-radius: 2px; cursor: pointer; flex-shrink: 0; }
  .day-box.on { background: #888; border-color: #888; }
  .day-box.today-box { border-color: #aaa; }
  .day-box.today-box.on { background: #999; border-color: #999; }

  .edit-row { display: flex; align-items: center; padding: 0 var(--side-pad); height: var(--row-h); border-bottom: 0.5px solid #111; flex-shrink: 0; gap: 2vw; }
  .edit-input { flex: 1; background: none; border: none; border-bottom: 0.5px solid #555; color: #fff; font-family: var(--font); font-size: var(--font-main); font-weight: 600; letter-spacing: -0.01em; outline: none; padding: 0; min-width: 0; }
  .edit-ok { font-size: var(--font-tiny); color: #555; cursor: pointer; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; flex-shrink: 0; }
  .edit-ok:active { color: #fff; }
  .edit-del { font-size: var(--font-tiny); color: #3a1a1a; cursor: pointer; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; flex-shrink: 0; }
  .edit-del:active { color: #c00; }

  .add-row { display: flex; align-items: center; padding: 0 var(--side-pad); height: var(--row-h); cursor: pointer; flex-shrink: 0; }
  .habit-row.dragging { opacity: 0.4; }
  .habit-row.drag-over { border-top: 1.5px solid #555; }
  .drag-handle { font-size: calc(var(--font-small) * 0.9); color: #333; cursor: grab; padding: 0 2vw 0 0; flex-shrink: 0; user-select: none; touch-action: none; }
  .drag-handle:active { color: #666; cursor: grabbing; }
  .add-label { font-size: var(--font-main); font-weight: 600; color: #2a2a2a; }

  .stat-list { flex: 1; display: flex; flex-direction: column; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .stat-row { display: flex; align-items: center; justify-content: space-between; padding: 0 var(--side-pad); height: var(--row-h); border-bottom: 0.5px solid #111; flex-shrink: 0; }
  .stat-row:last-child { border-bottom: none; }
  .stat-left { display: flex; flex-direction: column; justify-content: center; max-width: 60%; overflow: hidden; }
  .stat-name { font-size: var(--font-main); font-weight: 600; letter-spacing: -0.01em; color: #bbb; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .stat-since { font-size: var(--font-tiny); color: #555; letter-spacing: 0.02em; margin-top: 0.3vh; }
  .stat-val { font-size: var(--font-main); font-weight: 600; color: #888; white-space: nowrap; }
  .stat-val em { color: #444; font-style: normal; }

  .bottom-rows { flex-shrink: 0; border-top: 0.5px solid #1a1a1a; }
  .bottom-row { display: flex; align-items: center; padding: 0 var(--side-pad); height: var(--bottom-row-h); border-bottom: 0.5px solid #111; cursor: pointer; flex-shrink: 0; }
  .bottom-row:last-child { border-bottom: none; }
  .bottom-label { font-size: var(--font-small); font-weight: 600; letter-spacing: -0.01em; }
  .bottom-label.dim { color: #2a2a2a; }
  .bottom-label.muted { color: #1a1a1a; }

  .time-row { display: none; align-items: center; justify-content: space-between; padding: 0 var(--side-pad); height: var(--bottom-row-h); border-bottom: 0.5px solid #111; }
  .time-row.visible { display: flex; }
  .time-label { font-size: var(--font-small); font-weight: 600; color: #2a2a2a; }
  .time-select { background: none; border: none; color: #444; font-family: var(--font); font-size: var(--font-tiny); font-weight: 600; outline: none; cursor: pointer; -webkit-appearance: none; }

  .auth-wrap { flex: 1; display: flex; flex-direction: column; padding: 0 var(--side-pad); }
  .auth-field { display: flex; flex-direction: column; margin-top: 2.5vh; }
  .auth-label { font-size: var(--font-tiny); font-weight: 500; color: #444; letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 1vh; }
  .auth-input { background: none; border: none; border-bottom: 0.5px solid #333; color: #fff; font-family: var(--font); font-size: calc(var(--font-main) * 1.4); font-weight: 700; letter-spacing: -0.02em; outline: none; padding: 1vh 0; width: 100%; }
  .auth-input::placeholder { color: #2a2a2a; }
  .auth-btn { margin-top: 3vh; font-size: calc(var(--font-main) * 1.4); font-weight: 700; letter-spacing: -0.02em; color: #fff; cursor: pointer; background: none; border: none; font-family: var(--font); padding: 0; text-align: left; }
  .auth-btn:active { color: #555; }
  .auth-switch { margin-top: 2vh; font-size: var(--font-small); color: #333; cursor: pointer; }
  .auth-error { margin-top: 1.5vh; font-size: var(--font-tiny); color: #633; min-height: 2vh; }
  .auth-link { margin-top: 1.5vh; font-size: var(--font-small); color: #333; cursor: pointer; text-decoration: none; display: block; }
  .auth-link:active { color: #666; }

  .reset-wrap { flex: 1; display: flex; flex-direction: column; padding: 0 var(--side-pad); }

  .home-bar { height: 3.5vh; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
  .home-indicator { width: 30vw; height: 0.6vh; background: #1a1a1a; border-radius: 1vh; }

  #export-card { position: fixed; left: -9999px; top: 0; width: 750px; background: #000; padding: 80px 60px; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }
  #export-card .ex-year { font-size: 22px; font-weight: 500; color: #444; letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 48px; }
  #export-card .ex-row { display: flex; justify-content: space-between; align-items: baseline; padding: 28px 0; border-bottom: 0.5px solid #1a1a1a; }
  #export-card .ex-row:last-child { border-bottom: none; }
  #export-card .ex-name { font-size: 48px; font-weight: 700; letter-spacing: -0.02em; color: #fff; }
  #export-card .ex-val { font-size: 28px; font-weight: 600; color: #888; }
  #export-card .ex-pct { color: #444; }

  .hamburger { font-size:calc(var(--font-main)*1.2); color:#444; cursor:pointer; user-select:none; padding-left:4vw; }
  .hamburger:active { color:#888; }
  .sr-only { position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0); }
  .spinner { display: inline-block; width: 3vw; height: 3vw; border: 1.5px solid #333; border-top-color: #fff; border-radius: 50%; animation: spin 0.7s linear infinite; margin-left: 2vw; vertical-align: middle; }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media screen and (orientation: landscape) {
    .app {
      transform: rotate(-90deg);
      transform-origin: left top;
      width: 100vh;
      height: 100vw;
      position: fixed;
      top: 100%;
      left: 0;
    }
  }
</style>
</head>
<body>
<div class="app">
  <div class="status-bar">
    <span class="status-date" id="top-date"></span>
    <span class="status-icons">▲▲▲</span>
  </div>

  <!-- Auth: Sign in / Register -->
  <div class="view active" id="v-auth">
    <div class="nav-row"><span class="nav-item active" id="auth-title">Sign in</span></div>
    <div class="auth-wrap">
      <div class="auth-field">
        <div class="auth-label">Email</div>
        <input class="auth-input" id="auth-email" type="email" placeholder="you@example.com" autocomplete="email" autocorrect="off" autocapitalize="none" maxlength="100">
      </div>
      <div class="auth-field">
        <div class="auth-label">PIN</div>
        <input class="auth-input" id="auth-pin" type="password" inputmode="numeric" placeholder="····" maxlength="8">
      </div>
      <div class="auth-error" id="auth-error"></div>
      <button class="auth-btn" id="auth-submit-btn" onclick="authSubmit()">Continue →</button>
      <div class="auth-switch" id="auth-switch-btn" onclick="toggleAuthMode()">No account? Register</div>
      <span class="auth-link" id="forgot-link" onclick="showReset()">Forgot PIN?</span>
    </div>
  </div>

  <!-- Password reset request -->
  <div class="view" id="v-reset">
    <div class="nav-row"><span class="nav-item active">Reset PIN</span></div>
    <div class="reset-wrap">
      <div class="auth-field">
        <div class="auth-label">Your email</div>
        <input class="auth-input" id="reset-email" type="email" placeholder="you@example.com" autocomplete="email" autocorrect="off" autocapitalize="none" maxlength="100">
      </div>
      <div class="auth-error" id="reset-error"></div>
      <button class="auth-btn" id="reset-submit-btn" onclick="requestReset()">Send reset email →</button>
      <span class="auth-link" onclick="showAuth()">← Back to sign in</span>
    </div>
  </div>

  <!-- Reset PIN with token -->
  <div class="view" id="v-reset-confirm">
    <div class="nav-row"><span class="nav-item active">New PIN</span></div>
    <div class="reset-wrap">
      <div class="auth-field">
        <div class="auth-label">Reset token (from email)</div>
        <input class="auth-input" id="reset-token" type="text" placeholder="paste token here" autocomplete="off" autocorrect="off" autocapitalize="none">
      </div>
      <div class="auth-field">
        <div class="auth-label">New PIN</div>
        <input class="auth-input" id="reset-new-pin" type="password" inputmode="numeric" placeholder="····" maxlength="8">
      </div>
      <div class="auth-error" id="reset-confirm-error"></div>
      <button class="auth-btn" id="reset-confirm-btn" onclick="confirmReset()">Update PIN →</button>
      <span class="auth-link" onclick="showAuth()">← Back to sign in</span>
    </div>
  </div>

  <!-- Main app -->
  <div class="view" id="v-main">
    <div class="view active" id="v-activity">
      <div class="nav-row">
        <span class="nav-item active" onclick="switchTab('activity')">Activity</span>
        <span class="nav-item" onclick="switchTab('progress')">Progress</span>
        <span class="hamburger" onclick="openSettings()">&#9776;</span>
      </div>
      <div class="day-header" id="day-header"></div>
      <div class="habit-list" id="act-list"></div>
    </div>

    <div class="view" id="v-progress">
      <div class="nav-row">
        <span class="nav-item" onclick="switchTab('activity')">Activity</span>
        <span class="nav-item active" onclick="switchTab('progress')">Progress</span>
        <span class="hamburger" onclick="openSettings()">&#9776;</span>
      </div>
      <div class="stat-list" id="stat-list"></div>

    </div>
  </div>

  <div class="home-bar"><div class="home-indicator"></div></div>
</div>

<div id="settings-panel" style="display:none;position:fixed;top:0;right:0;width:70vw;height:100%;background:#0a0a0a;border-left:0.5px solid #1c1c1c;z-index:999;flex-direction:column;padding-top:env(safe-area-inset-top);">
  <div style="display:flex;align-items:center;justify-content:space-between;padding:1.5vh 5vw;border-bottom:0.5px solid #1c1c1c;">
    <span style="font-size:calc(var(--font-main)*1.2);font-weight:700;color:#fff;">Settings</span>
    <span onclick="closeSettings()" style="font-size:calc(var(--font-main)*1.4);color:#555;cursor:pointer;padding:0 0 0 4vw;">&#x2715;</span>
  </div>
  <div id="settings-notif-row" onclick="toggleNotifications()" style="display:none;align-items:center;padding:0 5vw;height:var(--bottom-row-h);border-bottom:0.5px solid #111;cursor:pointer;">
    <span style="font-size:var(--font-small);font-weight:600;color:#2a2a2a;" id="notif-label">Enable notifications</span>
  </div>
  <div id="settings-time-row" style="display:none;align-items:center;justify-content:space-between;padding:0 5vw;height:var(--bottom-row-h);border-bottom:0.5px solid #111;">
    <span style="font-size:var(--font-small);font-weight:600;color:#2a2a2a;">Reminder time</span>
    <select id="time-select" onchange="updateNotifHour(this.value)" style="background:none;border:none;color:#444;font-family:var(--font);font-size:var(--font-tiny);font-weight:600;outline:none;cursor:pointer;-webkit-appearance:none;"></select>
  </div>
  <div onclick="exportStats()" style="display:flex;align-items:center;padding:0 5vw;height:var(--bottom-row-h);border-bottom:0.5px solid #111;cursor:pointer;">
    <span style="font-size:var(--font-small);font-weight:600;color:#2a2a2a;">↓ Save as image</span>
  </div>
  <div onclick="logout()" style="display:flex;align-items:center;padding:0 5vw;height:var(--bottom-row-h);cursor:pointer;">
    <span style="font-size:var(--font-small);font-weight:600;color:#1a1a1a;">Sign out</span>
  </div>
</div>
<div id="settings-overlay" onclick="closeSettings()" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:998;"></div>
<div id="export-card"></div>
  <div style="font-size:4vw;font-weight:600;color:#555;letter-spacing:0.06em;text-transform:uppercase;">Rotate to portrait</div>
</div>

<script>
  const SUPA_URL='https://lltsprypxkctvpxebdsw.supabase.co';
  const SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxsdHNwcnlweGtjdHZweGViZHN3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgxNzg1MzAsImV4cCI6MjA5Mzc1NDUzMH0.REHs6X7F5xKMVX8OEYZ9dHpvHw1G4XjXTGO1DtE_dMg';
  const VAPID_PUBLIC='BBgyykJorT9aXwkxOhZjDVx5fiYS-Lqo52ssU0A7sm3ua1BDr4D4TEJudxwfcRDufcz6C4G1hbE0XdnEwQT3RrY';
  const MAX_HABITS=10,MIN_HABITS=1,SESSION_KEY='activity_session_v3',DAYS_BACK=3;
  let currentUser=null,userEmail=null,habitNames=[],startDates=[],log={},joinedDate=null,editingIdx=null,authMode='login';

  // ── Dates ─────────────────────────────────────────────────────────
  function dateStr(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
  function todayStr(){return dateStr(new Date());}

  function getWindowDates(activityIdx){
    // Return dates from activity start date (or 3 days ago, whichever is more recent) up to today
    const today=new Date();
    const startDate=startDates[activityIdx]?new Date(startDates[activityIdx]):today;
    const earliest=new Date(today);
    earliest.setDate(earliest.getDate()-DAYS_BACK);
    const from=startDate>earliest?startDate:earliest;
    const dates=[];
    for(let d=new Date(from);d<=today;d.setDate(d.getDate()+1)){dates.push(new Date(d));}
    return dates;
  }

  function getHeaderDates(){
    // Always show up to 4 columns in header (aligned right = today)
    const dates=[];
    for(let i=DAYS_BACK;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);dates.push(d);}
    return dates;
  }

  function updateDate(){
    const n=new Date();
    const months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    document.getElementById('top-date').textContent=n.getDate()+' '+months[n.getMonth()];
  }
  updateDate();

  function daysSince(dateString){
    if(!dateString)return 1;
    const[sy,sm,sd]=dateString.split('-').map(Number);
    const[ny,nm,nd]=todayStr().split('-').map(Number);
    return Math.max(1,Math.floor((new Date(ny,nm-1,nd)-new Date(sy,sm-1,sd))/86400000)+1);
  }

  function formatDate(dateString){
    if(!dateString)return '';
    const[y,m,d]=dateString.split('-').map(Number);
    const months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    return d+' '+months[m-1]+' '+y;
  }

  // ── Hashing ───────────────────────────────────────────────────────
  async function hashPin(pin){
    const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(pin));
    return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
  }

  // ── Supabase ──────────────────────────────────────────────────────
  async function sbGetByEmail(email){
    const res=await fetch(SUPA_URL+'/rest/v1/users?email=eq.'+encodeURIComponent(email.toLowerCase())+'&select=*',{headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY}});
    return(await res.json())[0]||null;
  }
  async function sbInsert(email,hashedPin){
    const res=await fetch(SUPA_URL+'/rest/v1/users',{method:'POST',headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY,'Content-Type':'application/json','Prefer':'return=representation'},body:JSON.stringify({email:email.toLowerCase(),username:email.toLowerCase(),pin:hashedPin,habit_names:[],start_dates:[],log:{},joined_date:todayStr()})});
    return(await res.json())[0]||null;
  }
  async function sbUpdate(email,data){
    await fetch(SUPA_URL+'/rest/v1/users?email=eq.'+encodeURIComponent(email.toLowerCase()),{method:'PATCH',headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY,'Content-Type':'application/json'},body:JSON.stringify(data)});
  }

  // ── Password reset (simple token system) ─────────────────────────
  async function requestReset(){
    const email=document.getElementById('reset-email').value.trim().toLowerCase();
    const errEl=document.getElementById('reset-error');
    const btn=document.getElementById('reset-submit-btn');
    errEl.textContent='';
    if(!email){errEl.textContent='Please enter your email.';return;}
    btn.innerHTML='Sending <span class="spinner"></span>';
    const user=await sbGetByEmail(email);
    if(!user){errEl.textContent='No account found with that email.';btn.textContent='Send reset email →';return;}
    // Generate a simple reset token and store it with expiry
    const token=Array.from(crypto.getRandomValues(new Uint8Array(16))).map(b=>b.toString(16).padStart(2,'0')).join('');
    const expiry=new Date(Date.now()+3600000).toISOString(); // 1 hour
    await sbUpdate(email,{reset_token:token,reset_expiry:expiry});
    // Send email via Supabase Edge Function
    await fetch(SUPA_URL+'/functions/v1/send-reset-email',{
      method:'POST',
      headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY,'Content-Type':'application/json'},
      body:JSON.stringify({email,token})
    });
    errEl.style.color='#557';
    errEl.textContent='Reset email sent. Check your inbox.';
    btn.textContent='Send reset email →';
    // Show token input after a moment
    setTimeout(()=>showResetConfirm(),1500);
  }

  async function confirmReset(){
    const token=document.getElementById('reset-token').value.trim();
    const newPin=document.getElementById('reset-new-pin').value.trim();
    const errEl=document.getElementById('reset-confirm-error');
    const btn=document.getElementById('reset-confirm-btn');
    errEl.textContent='';
    if(!token){errEl.textContent='Please paste your reset token.';return;}
    if(!newPin||newPin.length<4){errEl.textContent='PIN must be at least 4 digits.';return;}
    btn.innerHTML='Updating <span class="spinner"></span>';
    // Find user with this token
    const res=await fetch(SUPA_URL+'/rest/v1/users?reset_token=eq.'+encodeURIComponent(token)+'&select=*',{headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY}});
    const rows=await res.json();
    const user=rows[0];
    if(!user){errEl.textContent='Invalid token.';btn.textContent='Update PIN →';return;}
    if(new Date(user.reset_expiry)<new Date()){errEl.textContent='Token expired. Request a new one.';btn.textContent='Update PIN →';return;}
    const hashedPin=await hashPin(newPin);
    await sbUpdate(user.email,{pin:hashedPin,reset_token:null,reset_expiry:null});
    errEl.style.color='#557';
    errEl.textContent='PIN updated! Signing you in...';
    setTimeout(()=>{saveSession(user.email,hashedPin);loginAs({...user,pin:hashedPin});},1000);
  }

  // ── Session ───────────────────────────────────────────────────────
  function saveSession(email,h){try{localStorage.setItem(SESSION_KEY,JSON.stringify({email,hashedPin:h}));}catch(e){}}
  function clearSession(){try{localStorage.removeItem(SESSION_KEY);}catch(e){}}
  function loadSession(){try{const r=localStorage.getItem(SESSION_KEY);return r?JSON.parse(r):null;}catch(e){return null;}}

  // ── View switching ────────────────────────────────────────────────
  function showView(id){
    ['v-auth','v-reset','v-reset-confirm','v-main'].forEach(v=>{
      document.getElementById(v).classList.toggle('active',v===id);
    });
  }
  function showAuth(){showView('v-auth');}
  function showReset(){document.getElementById('reset-email').value='';document.getElementById('reset-error').textContent='';showView('v-reset');}
  function showResetConfirm(){document.getElementById('reset-token').value='';document.getElementById('reset-new-pin').value='';document.getElementById('reset-confirm-error').textContent='';showView('v-reset-confirm');}

  // ── Auth ──────────────────────────────────────────────────────────
  function toggleAuthMode(){
    authMode=authMode==='login'?'register':'login';
    document.getElementById('auth-title').textContent=authMode==='login'?'Sign in':'Register';
    document.getElementById('auth-submit-btn').textContent='Continue →';
    document.getElementById('auth-switch-btn').textContent=authMode==='login'?'No account? Register':'Have an account? Sign in';
    document.getElementById('forgot-link').style.display=authMode==='login'?'block':'none';
    document.getElementById('auth-error').textContent='';
  }

  async function authSubmit(){
    const email=document.getElementById('auth-email').value.trim().toLowerCase();
    const pin=document.getElementById('auth-pin').value.trim();
    const errEl=document.getElementById('auth-error');
    const btn=document.getElementById('auth-submit-btn');
    errEl.textContent='';
    if(!email||!email.includes('@')){errEl.textContent='Please enter a valid email.';return;}
    if(!pin||pin.length<4){errEl.textContent='PIN must be at least 4 digits.';return;}
    btn.innerHTML='Continue <span class="spinner"></span>';
    const hashedPin=await hashPin(pin);
    if(authMode==='register'){
      const existing=await sbGetByEmail(email);
      if(existing){errEl.textContent='An account with that email already exists.';btn.textContent='Continue →';return;}
      const user=await sbInsert(email,hashedPin);
      if(!user){errEl.textContent='Registration failed. Try again.';btn.textContent='Continue →';return;}
      saveSession(email,hashedPin);loginAs(user);
    }else{
      const user=await sbGetByEmail(email);
      if(!user){errEl.textContent='No account found with that email.';btn.textContent='Continue →';return;}
      if(user.pin!==hashedPin){errEl.textContent='Incorrect PIN.';btn.textContent='Continue →';return;}
      saveSession(email,hashedPin);loginAs(user);
    }
  }

  function loginAs(user){
    currentUser=user.username||user.email;
    userEmail=user.email;
    habitNames=user.habit_names||[];
    startDates=user.start_dates||[];
    // Backfill startDates if missing
    while(startDates.length<habitNames.length)startDates.push(todayStr());
    log=user.log||{};
    joinedDate=user.joined_date||todayStr();
    ensureDates();
    showView('v-main');
    document.getElementById('v-activity').classList.add('active');
    document.getElementById('v-progress').classList.remove('active');
    updateDate();updateNotifLabel();renderDayHeader();renderActivity();renderStats();
  }

  function logout(){
    clearSession();currentUser=null;userEmail=null;habitNames=[];startDates=[];log={};joinedDate=null;
    showAuth();
    document.getElementById('auth-email').value='';
    document.getElementById('auth-pin').value='';
    document.getElementById('auth-error').textContent='';
    document.getElementById('auth-submit-btn').textContent='Continue →';
  }

  async function tryAutoLogin(){
    const s=loadSession();if(!s)return;
    const user=await sbGetByEmail(s.email);
    if(user&&user.pin===s.hashedPin)loginAs(user);else clearSession();
  }

  // ── Data ──────────────────────────────────────────────────────────
  function ensureDates(){
    // Ensure today's log entry exists for all habits
    const k=todayStr();
    if(!log[k])log[k]=[];
    while(log[k].length<habitNames.length)log[k].push(false);
  }

  function totalDaysSince(idx){
    const sd=startDates[idx];
    if(!sd)return 0;
    // Count only log entries on or after the activity's start date
    return Object.entries(log).filter(([k,e])=>Array.isArray(e)&&e[idx]===true&&k>=sd).length;
  }

  async function persist(){
    if(!userEmail)return;
    await sbUpdate(userEmail,{habit_names:habitNames,start_dates:startDates,log});
  }

  // ── Notifications ─────────────────────────────────────────────────
  function urlBase64ToUint8Array(b64){const pad='='.repeat((4-b64.length%4)%4);return new Uint8Array([...atob((b64+pad).replace(/-/g,'+').replace(/_/g,'/'))].map(c=>c.charCodeAt(0)));}

  async function updateNotifLabel(){
    const row=document.getElementById('settings-notif-row');
    const timeRow=document.getElementById('settings-time-row');
    const timeSelect=document.getElementById('time-select');
    if(!('Notification' in window)||!('serviceWorker' in navigator)){row.style.display='none';return;}
    row.style.display='flex';
    const reg=await navigator.serviceWorker.getRegistration();
    const sub=reg?await reg.pushManager.getSubscription():null;
    const el=document.getElementById('notif-label');
    if(Notification.permission==='denied'){
      el.textContent='Notifications blocked';row.style.pointerEvents='none';timeRow.classList.remove('visible');
    }else if(sub){
      el.textContent='Disable notifications';timeRow.classList.add('visible');
      if(timeSelect.options.length===0){
        for(let h=0;h<24;h++){const ampm=h<12?'AM':'PM';const label=(h===0?12:h>12?h-12:h)+':00 '+ampm;const opt=document.createElement('option');opt.value=h;opt.textContent=label;timeSelect.appendChild(opt);}
      }
      const res=await fetch(SUPA_URL+'/rest/v1/push_subscriptions?username=eq.'+encodeURIComponent(currentUser)+'&select=notif_hour',{headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY}});
      const rows=await res.json();timeSelect.value=rows[0]?.notif_hour??21;
    }else{
      el.textContent='Enable notifications';timeRow.classList.remove('visible');
    }
  }

  async function toggleNotifications(){
    if(!('serviceWorker' in navigator)){alert('Add this app to your home screen first.');return;}
    const reg=await navigator.serviceWorker.getRegistration();
    if(!reg){alert('Please add this app to your home screen first, then enable notifications.');return;}
    const existing=await reg.pushManager.getSubscription();
    if(existing){
      await existing.unsubscribe();
      await fetch(SUPA_URL+'/rest/v1/push_subscriptions?username=eq.'+encodeURIComponent(currentUser),{method:'DELETE',headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY}});
      await updateNotifLabel();return;
    }
    const perm=await Notification.requestPermission();
    if(perm!=='granted'){alert('Permission denied. Enable notifications in your device settings.');return;}
    try{
      const sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:urlBase64ToUint8Array(VAPID_PUBLIC)});
      const today=todayStr();
      await fetch(SUPA_URL+'/rest/v1/push_subscriptions',{method:'POST',headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY,'Content-Type':'application/json'},body:JSON.stringify({username:currentUser,subscription:sub.toJSON(),utc_offset:-new Date().getTimezoneOffset(),notif_hour:21,notif_start_date:today})});
      await updateNotifLabel();
    }catch(e){alert('Could not enable notifications: '+e.message);}
  }

  async function updateNotifHour(hour){
    await fetch(SUPA_URL+'/rest/v1/push_subscriptions?username=eq.'+encodeURIComponent(currentUser),{method:'PATCH',headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY,'Content-Type':'application/json'},body:JSON.stringify({notif_hour:parseInt(hour)})});
  }

  // ── Rendering ─────────────────────────────────────────────────────
  function renderDayHeader(){
    const header=document.getElementById('day-header');
    const days=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    const dates=getHeaderDates();const todayK=todayStr();
    header.innerHTML='<div class="day-header-spacer"></div>';
    dates.forEach(d=>{
      const col=document.createElement('div');
      col.className='day-col-hdr'+(dateStr(d)===todayK?' today-col':'');
      col.textContent=days[d.getDay()];header.appendChild(col);
    });
  }

  let dragSrcIdx = null;

  function renderActivity(){
    ensureDates();
    const todayK=todayStr();
    const headerDates=getHeaderDates();
    const list=document.getElementById('act-list');list.innerHTML='';

    if(habitNames.length===0){
      const addRow=document.createElement('div');addRow.className='add-row';addRow.onclick=addActivity;
      const addLabel=document.createElement('span');addLabel.className='add-label';addLabel.textContent='+ Add your first activity';
      addRow.appendChild(addLabel);list.appendChild(addRow);
      return;
    }

    habitNames.forEach((name,i)=>{
      if(editingIdx===i){
        const row=document.createElement('div');row.className='edit-row';
        const inp=document.createElement('input');inp.className='edit-input';
        inp.value=name==='New activity'?'':name;inp.maxLength=16;
        inp.setAttribute('autocomplete','off');inp.setAttribute('autocorrect','off');inp.setAttribute('autocapitalize','words');
        const confirm=()=>{
          const v=inp.value.trim();
          if(v)habitNames[i]=v;
          else if(name==='New activity'){
            habitNames.splice(i,1);startDates.splice(i,1);
            Object.keys(log).forEach(k=>{if(Array.isArray(log[k]))log[k].splice(i,1);});
          }
          editingIdx=null;persist();renderActivity();renderStats();
        };
        inp.onkeydown=e=>{if(e.key==='Enter'){inp.blur();confirm();}if(e.key==='Escape'){editingIdx=null;renderActivity();}};
        const ok=document.createElement('span');ok.className='edit-ok';ok.textContent='OK';ok.onclick=confirm;
        const del=document.createElement('span');del.className='edit-del';del.textContent='DEL';del.onclick=()=>deleteActivity(i);
        row.appendChild(inp);row.appendChild(ok);
        if(habitNames.length>MIN_HABITS)row.appendChild(del);
        list.appendChild(row);setTimeout(()=>{inp.focus();inp.select();},20);return;
      }

      const row=document.createElement('div');
      row.className='habit-row';
      row.dataset.idx=i;
      row.draggable=true;

      // Drag handle
      const handle=document.createElement('span');handle.className='drag-handle';handle.textContent='⠿';
      handle.addEventListener('touchstart',e=>onTouchStart(e,i),{passive:false});

      const nameEl=document.createElement('span');nameEl.className='habit-name';nameEl.textContent=name;
      const pencil=document.createElement('span');pencil.className='pencil';pencil.textContent='✎';
      pencil.onclick=e=>{e.stopPropagation();editingIdx=i;renderActivity();};

      // Desktop drag events
      row.addEventListener('dragstart',e=>{
        dragSrcIdx=i;
        row.classList.add('dragging');
        e.dataTransfer.effectAllowed='move';
      });
      row.addEventListener('dragend',()=>{
        row.classList.remove('dragging');
        document.querySelectorAll('.habit-row').forEach(r=>r.classList.remove('drag-over'));
      });
      row.addEventListener('dragover',e=>{
        e.preventDefault();e.dataTransfer.dropEffect='move';
        document.querySelectorAll('.habit-row').forEach(r=>r.classList.remove('drag-over'));
        row.classList.add('drag-over');
      });
      row.addEventListener('drop',e=>{
        e.preventDefault();
        if(dragSrcIdx===null||dragSrcIdx===i)return;
        reorderActivity(dragSrcIdx,i);
      });

      // Day boxes
      const activityDates=getWindowDates(i);
      const activityDateStrs=new Set(activityDates.map(d=>dateStr(d)));
      headerDates.forEach(d=>{
        const k=dateStr(d);const isToday=k===todayK;const inWindow=activityDateStrs.has(k);
        const cell=document.createElement('div');cell.className='day-cell';
        if(inWindow){
          const on=log[k]&&log[k][i]===true;
          const box=document.createElement('div');
          box.className='day-box'+(isToday?' today-box':'')+(on?' on':'');
          box.onclick=()=>{
            if(!log[k])log[k]=[];
            while(log[k].length<habitNames.length)log[k].push(false);
            log[k][i]=!log[k][i];box.classList.toggle('on',log[k][i]);persist();renderStats();
          };
          cell.appendChild(box);
        }
        row.appendChild(cell);
      });

      row.insertBefore(handle,row.firstChild);
      row.insertBefore(nameEl,row.children[1]);
      row.insertBefore(pencil,row.children[2]);
      list.appendChild(row);
    });

    if(habitNames.length<MAX_HABITS){
      const addRow=document.createElement('div');addRow.className='add-row';addRow.onclick=addActivity;
      const addLabel=document.createElement('span');addLabel.className='add-label';addLabel.textContent='+ Add activity';
      addRow.appendChild(addLabel);list.appendChild(addRow);
    }

    // Touch drag support
    setupTouchDrag();
  }

  function reorderActivity(fromIdx, toIdx){
    // Reorder habitNames, startDates, and each log entry
    const moveName=habitNames.splice(fromIdx,1)[0];
    habitNames.splice(toIdx,0,moveName);
    const moveDate=startDates.splice(fromIdx,1)[0];
    startDates.splice(toIdx,0,moveDate);
    Object.keys(log).forEach(k=>{
      if(!Array.isArray(log[k]))return;
      const val=log[k].splice(fromIdx,1)[0];
      log[k].splice(toIdx,0,val);
    });
    dragSrcIdx=null;
    persist();renderActivity();renderStats();
  }

  // Touch drag
  let touchDragIdx=null, touchClone=null, touchStartY=0, touchRows=[];

  function onTouchStart(e,i){
    e.preventDefault();
    touchDragIdx=i;
    touchStartY=e.touches[0].clientY;
    const row=e.target.closest('.habit-row');
    // Create visual clone
    touchClone=row.cloneNode(true);
    touchClone.style.cssText='position:fixed;left:'+row.getBoundingClientRect().left+'px;top:'+row.getBoundingClientRect().top+'px;width:'+row.offsetWidth+'px;opacity:0.85;background:#111;z-index:999;pointer-events:none;';
    document.body.appendChild(touchClone);
    row.classList.add('dragging');
    touchRows=Array.from(document.querySelectorAll('.habit-row'));
  }

  function setupTouchDrag(){
    document.removeEventListener('touchmove',onTouchMove);
    document.removeEventListener('touchend',onTouchEnd);
    document.addEventListener('touchmove',onTouchMove,{passive:false});
    document.addEventListener('touchend',onTouchEnd);
  }

  function onTouchMove(e){
    if(touchDragIdx===null)return;
    e.preventDefault();
    const y=e.touches[0].clientY;
    if(touchClone)touchClone.style.top=(y-30)+'px';
    // Highlight target row
    touchRows.forEach(r=>r.classList.remove('drag-over'));
    const target=touchRows.find(r=>{
      const rect=r.getBoundingClientRect();
      return y>=rect.top&&y<=rect.bottom&&parseInt(r.dataset.idx)!==touchDragIdx;
    });
    if(target)target.classList.add('drag-over');
  }

  function onTouchEnd(e){
    if(touchDragIdx===null)return;
    const y=e.changedTouches[0].clientY;
    if(touchClone){touchClone.remove();touchClone=null;}
    touchRows.forEach(r=>r.classList.remove('dragging','drag-over'));
    const target=touchRows.find(r=>{
      const rect=r.getBoundingClientRect();
      return y>=rect.top&&y<=rect.bottom&&parseInt(r.dataset.idx)!==touchDragIdx;
    });
    if(target){
      const toIdx=parseInt(target.dataset.idx);
      reorderActivity(touchDragIdx,toIdx);
    }
    touchDragIdx=null;touchRows=[];
  }
  function addActivity(){
    if(habitNames.length>=MAX_HABITS)return;
    const today=todayStr();
    habitNames.push('New activity');
    startDates.push(today);
    // Add false for new activity in all existing log entries
    Object.keys(log).forEach(k=>{if(Array.isArray(log[k]))log[k].push(false);});
    // Ensure today
    if(!log[today])log[today]=[];
    while(log[today].length<habitNames.length)log[today].push(false);
    editingIdx=habitNames.length-1;
    persist();renderActivity();renderStats();
  }

  function deleteActivity(i){
    if(habitNames.length<=MIN_HABITS&&habitNames.length>0){
      // Allow deleting down to 0
    }
    if(!confirm('Delete "'+habitNames[i]+'"? All data will be lost.'))return;
    habitNames.splice(i,1);startDates.splice(i,1);
    Object.keys(log).forEach(k=>{if(Array.isArray(log[k]))log[k].splice(i,1);});
    editingIdx=null;persist();renderActivity();renderStats();
  }

  function renderStats(){
    const list=document.getElementById('stat-list');list.innerHTML='';
    habitNames.forEach((name,i)=>{
      const sd=startDates[i]||todayStr();
      const elapsed=daysSince(sd);
      const count=totalDaysSince(i);
      const pct=Math.round((count/elapsed)*100);
      const row=document.createElement('div');row.className='stat-row';
      const left=document.createElement('div');left.className='stat-left';
      const nameEl=document.createElement('div');nameEl.className='stat-name';nameEl.textContent=name;
      const since=document.createElement('div');since.className='stat-since';since.textContent='since '+formatDate(sd);
      left.appendChild(nameEl);left.appendChild(since);
      const val=document.createElement('div');val.className='stat-val';
      val.innerHTML=count+' <em>/ '+pct+'%</em>';
      row.appendChild(left);row.appendChild(val);
      list.appendChild(row);
    });
  }

  function exportStats(){
    const year=new Date().getFullYear();
    const card=document.getElementById('export-card');
    let html='<div class="ex-year">'+(userEmail||currentUser)+' · '+year+'</div>';
    habitNames.forEach((name,i)=>{
      const sd=startDates[i]||todayStr();
      const elapsed=daysSince(sd);
      const count=totalDaysSince(i);
      const pct=Math.round((count/elapsed)*100);
      html+='<div class="ex-row"><span class="ex-name">'+name+'</span><span class="ex-val">'+count+' <span class="ex-pct">/ '+pct+'%</span></span></div>';
    });
    card.innerHTML=html;
    setTimeout(()=>{
      html2canvas(card,{backgroundColor:'#000000',scale:2,useCORS:true,logging:false}).then(canvas=>{
        const link=document.createElement('a');link.download='activity-'+year+'.png';
        link.download='activity-'+year+'.jpg';
        link.href=canvas.toDataURL('image/jpeg',0.92);link.click();card.innerHTML='';
      });
    },100);
  }

  function openSettings(){
    updateNotifLabel();
    document.getElementById('settings-panel').style.display='flex';
    document.getElementById('settings-overlay').style.display='block';
  }
  function closeSettings(){
    document.getElementById('settings-panel').style.display='none';
    document.getElementById('settings-overlay').style.display='none';
  }

  function switchTab(tab){
    document.getElementById('v-activity').classList.toggle('active',tab==='activity');
    document.getElementById('v-progress').classList.toggle('active',tab==='progress');
    document.querySelectorAll('.nav-item').forEach(el=>{
      el.classList.toggle('active',(tab==='activity'&&el.textContent==='Activity')||(tab==='progress'&&el.textContent==='Stats'));
    });
    if(tab==='progress'){updateNotifLabel();renderStats();}
  }

  document.addEventListener('visibilitychange',()=>{
    if(!document.hidden&&currentUser){ensureDates();renderDayHeader();renderActivity();renderStats();updateDate();}
  });

  document.getElementById('auth-pin').addEventListener('keydown',e=>{if(e.key==='Enter')authSubmit();});
  document.getElementById('auth-email').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('auth-pin').focus();});

  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('/habits/sw.js').catch(err=>console.warn('SW:',err));
  }

  tryAutoLogin();
</script>
</body>
