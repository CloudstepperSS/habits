<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Activity">
<title>Activity</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  :root { --side-pad: 20px; --font: 'Helvetica Neue', Helvetica, Arial, sans-serif; --row-h: 56px; --box-size: 18px; --col-w: 38px; }
  html, body { width: 100%; height: 100%; background: #000; color: #fff; font-family: var(--font); overflow: hidden; }
  .app { display: flex; flex-direction: column; width: 100%; height: 100%; padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); background: #000; }
  .status-bar { display: flex; justify-content: space-between; align-items: center; padding: 10px var(--side-pad) 4px; flex-shrink: 0; }
  .status-date { font-size: 12px; font-weight: 500; color: #555; letter-spacing: 0.06em; text-transform: uppercase; }
  .status-icons { font-size: 11px; color: #555; }
  .content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

  .view { display: none; flex-direction: column; flex: 1; overflow: hidden; }
  .view.active { display: flex; }

  .nav-row { display: flex; justify-content: space-between; align-items: center; height: 52px; padding: 0 var(--side-pad); border-bottom: 0.5px solid #1c1c1c; flex-shrink: 0; }
  .nav-item { font-size: 24px; font-weight: 700; letter-spacing: -0.02em; color: #2a2a2a; cursor: pointer; user-select: none; }
  .nav-item.active { color: #fff; }

  /* Day header */
  .day-header { display: flex; align-items: center; padding: 6px var(--side-pad) 5px; border-bottom: 0.5px solid #1a1a1a; flex-shrink: 0; }
  .day-header-spacer { flex: 1; }
  .day-col-hdr { width: var(--col-w); text-align: center; font-size: 9px; color: #2a2a2a; letter-spacing: 0.05em; text-transform: uppercase; flex-shrink: 0; }
  .day-col-hdr.today-col { color: #555; }

  /* Habit rows */
  .habit-list { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  .habit-row { display: flex; align-items: center; padding: 0 var(--side-pad); height: var(--row-h); border-bottom: 0.5px solid #0f0f0f; flex-shrink: 0; }
  .habit-row:last-child { border-bottom: none; }
  .habit-name { flex: 1; font-size: 15px; font-weight: 600; letter-spacing: -0.01em; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pencil { font-size: 13px; color: #222; cursor: pointer; padding: 0 8px 0 4px; flex-shrink: 0; user-select: none; }
  .pencil:active { color: #555; }
  .day-cell { width: var(--col-w); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .day-box { width: var(--box-size); height: var(--box-size); border: 0.5px solid #1e1e1e; border-radius: 2px; cursor: pointer; flex-shrink: 0; }
  .day-box.on { background: #777; border-color: #777; }
  .day-box.today-box { border-color: #333; }
  .day-box.today-box.on { background: #888; border-color: #888; }

  /* Edit row */
  .edit-row { display: flex; align-items: center; padding: 0 var(--side-pad); height: var(--row-h); border-bottom: 0.5px solid #0f0f0f; flex-shrink: 0; gap: 8px; }
  .edit-input { flex: 1; background: none; border: none; border-bottom: 0.5px solid #555; color: #fff; font-family: var(--font); font-size: 15px; font-weight: 600; letter-spacing: -0.01em; outline: none; padding: 0; min-width: 0; }
  .edit-ok { font-size: 12px; color: #555; cursor: pointer; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; flex-shrink: 0; }
  .edit-ok:active { color: #fff; }
  .edit-del { font-size: 12px; color: #3a1a1a; cursor: pointer; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; flex-shrink: 0; }
  .edit-del:active { color: #c00; }

  /* Add row */
  .add-row { display: flex; align-items: center; padding: 0 var(--side-pad); height: var(--row-h); cursor: pointer; flex-shrink: 0; }
  .add-label { font-size: 15px; font-weight: 600; color: #222; }

  /* Stats */
  .stat-list { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  .stat-row { display: flex; align-items: center; justify-content: space-between; padding: 0 var(--side-pad); height: var(--row-h); border-bottom: 0.5px solid #0f0f0f; flex-shrink: 0; }
  .stat-row:last-child { border-bottom: none; }
  .stat-name { font-size: 15px; font-weight: 600; letter-spacing: -0.01em; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 60%; }
  .stat-val { font-size: 15px; font-weight: 600; color: #888; white-space: nowrap; }
  .stat-val em { color: #444; font-style: normal; }

  /* Bottom rows */
  .bottom-rows { flex-shrink: 0; border-top: 0.5px solid #1a1a1a; }
  .bottom-row { display: flex; align-items: center; padding: 0 var(--side-pad); height: 44px; border-bottom: 0.5px solid #0f0f0f; cursor: pointer; flex-shrink: 0; }
  .bottom-row:last-child { border-bottom: none; }
  .bottom-label { font-size: 14px; font-weight: 600; letter-spacing: -0.01em; }
  .bottom-label.dim { color: #2a2a2a; }
  .bottom-label.muted { color: #1a1a1a; }

  .time-row { display: none; align-items: center; justify-content: space-between; padding: 0 var(--side-pad); height: 44px; border-bottom: 0.5px solid #0f0f0f; }
  .time-row.visible { display: flex; }
  .time-label { font-size: 14px; font-weight: 600; color: #2a2a2a; }
  .time-select { background: none; border: none; color: #444; font-family: var(--font); font-size: 13px; font-weight: 600; outline: none; cursor: pointer; -webkit-appearance: none; }

  /* Auth */
  .auth-wrap { flex: 1; display: flex; flex-direction: column; padding: 0 var(--side-pad); }
  .auth-field { display: flex; flex-direction: column; margin-top: 20px; }
  .auth-label { font-size: 11px; font-weight: 500; color: #444; letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 8px; }
  .auth-input { background: none; border: none; border-bottom: 0.5px solid #333; color: #fff; font-family: var(--font); font-size: 24px; font-weight: 700; letter-spacing: -0.02em; outline: none; padding: 8px 0; width: 100%; }
  .auth-input::placeholder { color: #2a2a2a; }
  .auth-btn { margin-top: 28px; font-size: 24px; font-weight: 700; letter-spacing: -0.02em; color: #fff; cursor: pointer; background: none; border: none; font-family: var(--font); padding: 0; text-align: left; }
  .auth-btn:active { color: #555; }
  .auth-switch { margin-top: 20px; font-size: 13px; color: #333; cursor: pointer; }
  .auth-error { margin-top: 14px; font-size: 12px; color: #633; min-height: 16px; }

  .home-bar { height: 30px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
  .home-indicator { width: 120px; height: 4px; background: #1a1a1a; border-radius: 2px; }

  #export-card { position: fixed; left: -9999px; top: 0; width: 750px; background: #000; padding: 80px 60px; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }
  #export-card .ex-year { font-size: 22px; font-weight: 500; color: #444; letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 48px; }
  #export-card .ex-row { display: flex; justify-content: space-between; align-items: baseline; padding: 28px 0; border-bottom: 0.5px solid #1a1a1a; }
  #export-card .ex-row:last-child { border-bottom: none; }
  #export-card .ex-name { font-size: 48px; font-weight: 700; letter-spacing: -0.02em; color: #fff; }
  #export-card .ex-val { font-size: 28px; font-weight: 600; color: #888; }
  #export-card .ex-pct { color: #444; }

  .spinner { display: inline-block; width: 14px; height: 14px; border: 1.5px solid #333; border-top-color: #fff; border-radius: 50%; animation: spin 0.7s linear infinite; margin-left: 8px; vertical-align: middle; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="app">
  <div class="status-bar">
    <span class="status-date" id="top-date"></span>
    <span class="status-icons">▲▲▲</span>
  </div>

  <!-- Auth -->
  <div class="view active" id="v-auth">
    <div class="nav-row"><span class="nav-item active" id="auth-title">Sign in</span></div>
    <div class="auth-wrap">
      <div class="auth-field">
        <div class="auth-label">Username</div>
        <input class="auth-input" id="auth-username" type="text" placeholder="your name" autocomplete="off" autocorrect="off" autocapitalize="words" maxlength="24">
      </div>
      <div class="auth-field">
        <div class="auth-label">PIN</div>
        <input class="auth-input" id="auth-pin" type="password" inputmode="numeric" placeholder="····" maxlength="8">
      </div>
      <div class="auth-error" id="auth-error"></div>
      <button class="auth-btn" id="auth-submit-btn" onclick="authSubmit()">Continue →</button>
      <div class="auth-switch" id="auth-switch-btn" onclick="toggleAuthMode()">No account? Register</div>
    </div>
  </div>

  <!-- Main -->
  <div class="view" id="v-main">
    <div class="view active" id="v-activity">
      <div class="nav-row">
        <span class="nav-item active" onclick="switchTab('activity')">Activity</span>
        <span class="nav-item" onclick="switchTab('stats')">Stats</span>
      </div>
      <div class="day-header" id="day-header"></div>
      <div class="habit-list" id="act-list"></div>
    </div>

    <div class="view" id="v-stats">
      <div class="nav-row">
        <span class="nav-item" onclick="switchTab('activity')">Activity</span>
        <span class="nav-item active" onclick="switchTab('stats')">Stats</span>
      </div>
      <div class="stat-list" id="stat-list"></div>
      <div class="bottom-rows">
        <div class="bottom-row" id="notif-row" onclick="toggleNotifications()" style="display:none;">
          <span class="bottom-label dim" id="notif-label">Enable notifications</span>
        </div>
        <div class="time-row" id="time-row">
          <span class="time-label">Reminder time</span>
          <select class="time-select" id="time-select" onchange="updateNotifHour(this.value)"></select>
        </div>
        <div class="bottom-row" onclick="exportStats()">
          <span class="bottom-label dim">↓ Save as image</span>
        </div>
        <div class="bottom-row" onclick="logout()">
          <span class="bottom-label muted">Sign out</span>
        </div>
      </div>
    </div>
  </div>

  <div class="home-bar"><div class="home-indicator"></div></div>
</div>

<div id="export-card"></div>

<script>
  const SUPA_URL = 'https://lltsprypxkctvpxebdsw.supabase.co';
  const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxsdHNwcnlweGtjdHZweGViZHN3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgxNzg1MzAsImV4cCI6MjA5Mzc1NDUzMH0.REHs6X7F5xKMVX8OEYZ9dHpvHw1G4XjXTGO1DtE_dMg';
  const VAPID_PUBLIC = 'BBgyykJorT9aXwkxOhZjDVx5fiYS-Lqo52ssU0A7sm3ua1BDr4D4TEJudxwfcRDufcz6C4G1hbE0XdnEwQT3RrY';
  const DEFAULT_NAMES = ['Gym','Nights out','Family','Abroad','Reading'];
  const MAX_HABITS = 10;
  const MIN_HABITS = 1;
  const SESSION_KEY = 'activity_session_v2';
  const DAYS_BACK = 3;

  let currentUser=null, habitNames=[], log={}, joinedDate=null, editingIdx=null, authMode='login';

  function dateStr(d) {
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  }
  function todayStr() { return dateStr(new Date()); }

  function getWindowDates() {
    const dates=[];
    for (let i=DAYS_BACK;i>=0;i--) { const d=new Date(); d.setDate(d.getDate()-i); dates.push(d); }
    return dates;
  }

  function updateDate() {
    const n=new Date();
    const months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    const todayFmt=n.getDate()+' '+months[n.getMonth()];
    let text=todayFmt;
    if (joinedDate) { const [sy,sm,sd]=joinedDate.split('-').map(Number); text=sd+' '+months[sm-1]+' / '+todayFmt; }
    document.getElementById('top-date').textContent=text;
  }
  updateDate();

  function daysSinceJoined() {
    if (!joinedDate) return 1;
    const [sy,sm,sd]=joinedDate.split('-').map(Number);
    const [ny,nm,nd]=todayStr().split('-').map(Number);
    return Math.max(1,Math.floor((new Date(ny,nm-1,nd)-new Date(sy,sm-1,sd))/86400000)+1);
  }

  async function hashPin(pin) {
    const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(pin));
    return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
  }

  async function sbGet(u) {
    const res=await fetch(SUPA_URL+'/rest/v1/users?username=eq.'+encodeURIComponent(u)+'&select=*',{headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY}});
    return (await res.json())[0]||null;
  }
  async function sbInsert(u,h) {
    const res=await fetch(SUPA_URL+'/rest/v1/users',{method:'POST',headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY,'Content-Type':'application/json','Prefer':'return=representation'},body:JSON.stringify({username:u,pin:h,habit_names:DEFAULT_NAMES,log:{},joined_date:todayStr()})});
    return (await res.json())[0]||null;
  }
  async function sbUpdate(u,data) {
    await fetch(SUPA_URL+'/rest/v1/users?username=eq.'+encodeURIComponent(u),{method:'PATCH',headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY,'Content-Type':'application/json'},body:JSON.stringify(data)});
  }

  function saveSession(u,h){try{localStorage.setItem(SESSION_KEY,JSON.stringify({username:u,hashedPin:h}));}catch(e){}}
  function clearSession(){try{localStorage.removeItem(SESSION_KEY);}catch(e){}}
  function loadSession(){try{const r=localStorage.getItem(SESSION_KEY);return r?JSON.parse(r):null;}catch(e){return null;}}

  function toggleAuthMode() {
    authMode=authMode==='login'?'register':'login';
    document.getElementById('auth-title').textContent=authMode==='login'?'Sign in':'Register';
    document.getElementById('auth-submit-btn').textContent='Continue →';
    document.getElementById('auth-switch-btn').textContent=authMode==='login'?'No account? Register':'Have an account? Sign in';
    document.getElementById('auth-error').textContent='';
  }

  async function authSubmit() {
    const username=document.getElementById('auth-username').value.trim();
    const pin=document.getElementById('auth-pin').value.trim();
    const errEl=document.getElementById('auth-error');
    const btn=document.getElementById('auth-submit-btn');
    errEl.textContent='';
    if (!username){errEl.textContent='Please enter a username.';return;}
    if (!pin||pin.length<4){errEl.textContent='PIN must be at least 4 digits.';return;}
    btn.innerHTML='Continue <span class="spinner"></span>';
    const hashedPin=await hashPin(pin);
    if (authMode==='register') {
      const existing=await sbGet(username);
      if (existing){errEl.textContent='That username is taken.';btn.textContent='Continue →';return;}
      const user=await sbInsert(username,hashedPin);
      if (!user){errEl.textContent='Registration failed. Try again.';btn.textContent='Continue →';return;}
      saveSession(username,hashedPin);loginAs(user);
    } else {
      const user=await sbGet(username);
      if (!user){errEl.textContent='User not found.';btn.textContent='Continue →';return;}
      if (user.pin!==hashedPin){errEl.textContent='Incorrect PIN.';btn.textContent='Continue →';return;}
      saveSession(username,hashedPin);loginAs(user);
    }
  }

  function loginAs(user) {
    currentUser=user.username; habitNames=user.habit_names||[...DEFAULT_NAMES];
    log=user.log||{}; joinedDate=user.joined_date||todayStr();
    ensureDates();
    document.getElementById('v-auth').classList.remove('active');
    document.getElementById('v-main').classList.add('active');
    document.getElementById('v-activity').classList.add('active');
    document.getElementById('v-stats').classList.remove('active');
    updateDate(); updateNotifLabel(); renderDayHeader(); renderActivity(); renderStats();
  }

  function logout() {
    clearSession(); currentUser=null; habitNames=[]; log={}; joinedDate=null;
    document.getElementById('v-main').classList.remove('active');
    document.getElementById('v-auth').classList.add('active');
    document.getElementById('auth-username').value='';
    document.getElementById('auth-pin').value='';
    document.getElementById('auth-error').textContent='';
    document.getElementById('auth-submit-btn').textContent='Continue →';
  }

  async function tryAutoLogin() {
    const s=loadSession(); if (!s) return;
    const user=await sbGet(s.username);
    if (user&&user.pin===s.hashedPin) loginAs(user); else clearSession();
  }

  function ensureDates() {
    getWindowDates().forEach(d=>{
      const k=dateStr(d);
      if (!log[k]) log[k]=[];
      while (log[k].length<habitNames.length) log[k].push(false);
    });
  }

  function totalDays(idx) {
    return Object.values(log).filter(e=>Array.isArray(e)&&e[idx]===true).length;
  }

  async function persist() {
    if (!currentUser) return;
    await sbUpdate(currentUser,{habit_names:habitNames,log});
  }

  function urlBase64ToUint8Array(b64) {
    const pad='='.repeat((4-b64.length%4)%4);
    return new Uint8Array([...atob((b64+pad).replace(/-/g,'+').replace(/_/g,'/'))].map(c=>c.charCodeAt(0)));
  }

  async function updateNotifLabel() {
    const row=document.getElementById('notif-row');
    const timeRow=document.getElementById('time-row');
    const timeSelect=document.getElementById('time-select');
    if (!('Notification' in window)||!('serviceWorker' in navigator)){row.style.display='none';return;}
    row.style.display='flex';
    const reg=await navigator.serviceWorker.getRegistration();
    const sub=reg?await reg.pushManager.getSubscription():null;
    const el=document.getElementById('notif-label');
    if (Notification.permission==='denied'){
      el.textContent='Notifications blocked';row.style.pointerEvents='none';timeRow.classList.remove('visible');
    } else if (sub) {
      el.textContent='Disable notifications';timeRow.classList.add('visible');
      if (timeSelect.options.length===0) {
        for (let h=0;h<24;h++){
          const ampm=h<12?'AM':'PM';
          const label=(h===0?12:h>12?h-12:h)+':00 '+ampm;
          const opt=document.createElement('option');opt.value=h;opt.textContent=label;timeSelect.appendChild(opt);
        }
      }
      const res=await fetch(SUPA_URL+'/rest/v1/push_subscriptions?username=eq.'+encodeURIComponent(currentUser)+'&select=notif_hour',{headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY}});
      const rows=await res.json();
      timeSelect.value=rows[0]?.notif_hour??21;
    } else {
      el.textContent='Enable notifications';timeRow.classList.remove('visible');
    }
  }

  async function toggleNotifications() {
    if (!('serviceWorker' in navigator)){alert('Add this app to your home screen first.');return;}
    const reg=await navigator.serviceWorker.getRegistration();
    if (!reg){alert('Please add this app to your home screen first, then enable notifications.');return;}
    const existing=await reg.pushManager.getSubscription();
    if (existing){
      await existing.unsubscribe();
      await fetch(SUPA_URL+'/rest/v1/push_subscriptions?username=eq.'+encodeURIComponent(currentUser),{method:'DELETE',headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY}});
      await updateNotifLabel();return;
    }
    const perm=await Notification.requestPermission();
    if (perm!=='granted'){alert('Permission denied. Enable notifications in your device settings.');return;}
    try {
      const sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:urlBase64ToUint8Array(VAPID_PUBLIC)});
      await fetch(SUPA_URL+'/rest/v1/push_subscriptions',{method:'POST',headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY,'Content-Type':'application/json'},body:JSON.stringify({username:currentUser,subscription:sub.toJSON(),utc_offset:-new Date().getTimezoneOffset(),notif_hour:21})});
      await updateNotifLabel();
    } catch(e){alert('Could not enable notifications: '+e.message);}
  }

  async function updateNotifHour(hour) {
    await fetch(SUPA_URL+'/rest/v1/push_subscriptions?username=eq.'+encodeURIComponent(currentUser),{method:'PATCH',headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY,'Content-Type':'application/json'},body:JSON.stringify({notif_hour:parseInt(hour)})});
  }

  function renderDayHeader() {
    const header=document.getElementById('day-header');
    const days=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    const dates=getWindowDates();
    const todayK=todayStr();
    header.innerHTML='<div class="day-header-spacer"></div>';
    dates.forEach(d=>{
      const col=document.createElement('div');
      col.className='day-col-hdr'+(dateStr(d)===todayK?' today-col':'');
      col.textContent=days[d.getDay()];
      header.appendChild(col);
    });
  }

  function renderActivity() {
    ensureDates();
    const dates=getWindowDates();
    const todayK=todayStr();
    const list=document.getElementById('act-list');
    list.innerHTML='';

    habitNames.forEach((name,i)=>{
      if (editingIdx===i) {
        const row=document.createElement('div');row.className='edit-row';
        const inp=document.createElement('input');inp.className='edit-input';
        inp.value=name==='New activity'?'':name;inp.maxLength=16;
        inp.setAttribute('autocomplete','off');inp.setAttribute('autocorrect','off');inp.setAttribute('autocapitalize','words');
        const confirm=()=>{
          const v=inp.value.trim();
          if(v)habitNames[i]=v;
          else if(name==='New activity'){habitNames.splice(i,1);Object.keys(log).forEach(k=>{if(Array.isArray(log[k]))log[k].splice(i,1);});}
          editingIdx=null;persist();renderActivity();renderStats();
        };
        inp.onkeydown=e=>{if(e.key==='Enter'){inp.blur();confirm();}if(e.key==='Escape'){editingIdx=null;renderActivity();}};
        const ok=document.createElement('span');ok.className='edit-ok';ok.textContent='OK';ok.onclick=confirm;
        const del=document.createElement('span');del.className='edit-del';del.textContent='DEL';del.onclick=()=>deleteActivity(i);
        row.appendChild(inp);row.appendChild(ok);
        if(habitNames.length>MIN_HABITS)row.appendChild(del);
        list.appendChild(row);
        setTimeout(()=>{inp.focus();inp.select();},20);
        return;
      }

      const row=document.createElement('div');row.className='habit-row';
      const nameEl=document.createElement('span');nameEl.className='habit-name';nameEl.textContent=name;
      const pencil=document.createElement('span');pencil.className='pencil';pencil.textContent='✎';
      pencil.onclick=e=>{e.stopPropagation();editingIdx=i;renderActivity();};

      dates.forEach(d=>{
        const k=dateStr(d);
        const isToday=k===todayK;
        const on=log[k]&&log[k][i]===true;
        const cell=document.createElement('div');cell.className='day-cell';
        const box=document.createElement('div');
        box.className='day-box'+(isToday?' today-box':'')+(on?' on':'');
        box.onclick=()=>{
          if(!log[k])log[k]=[];
          while(log[k].length<habitNames.length)log[k].push(false);
          log[k][i]=!log[k][i];
          box.classList.toggle('on',log[k][i]);
          persist();renderStats();
        };
        cell.appendChild(box);row.appendChild(cell);
      });

      row.insertBefore(nameEl,row.firstChild);
      row.insertBefore(pencil,row.children[1]);
      list.appendChild(row);
    });

    if(habitNames.length<MAX_HABITS){
      const addRow=document.createElement('div');addRow.className='add-row';addRow.onclick=addActivity;
      const addLabel=document.createElement('span');addLabel.className='add-label';addLabel.textContent='+ Add activity';
      addRow.appendChild(addLabel);list.appendChild(addRow);
    }
  }

  function addActivity() {
    if(habitNames.length>=MAX_HABITS)return;
    habitNames.push('New activity');
    Object.keys(log).forEach(k=>{if(Array.isArray(log[k]))log[k].push(false);});
    editingIdx=habitNames.length-1;
    persist();renderActivity();renderStats();
  }

  function deleteActivity(i) {
    if(habitNames.length<=MIN_HABITS)return;
    if(!confirm('Delete "'+habitNames[i]+'"? All data will be lost.'))return;
    habitNames.splice(i,1);
    Object.keys(log).forEach(k=>{if(Array.isArray(log[k]))log[k].splice(i,1);});
    editingIdx=null;persist();renderActivity();renderStats();
  }

  function renderStats() {
    const elapsed=daysSinceJoined();
    const list=document.getElementById('stat-list');
    list.innerHTML='';
    habitNames.forEach((name,i)=>{
      const count=totalDays(i);
      const pct=Math.round((count/elapsed)*100);
      const row=document.createElement('div');row.className='stat-row';
      row.innerHTML='<span class="stat-name">'+name+'</span><span class="stat-val">'+count+' <em>/ '+pct+'%</em></span>';
      list.appendChild(row);
    });
  }

  function exportStats() {
    const elapsed=daysSinceJoined();
    const year=new Date().getFullYear();
    const card=document.getElementById('export-card');
    let html='<div class="ex-year">'+currentUser+' · '+year+'</div>';
    habitNames.forEach((name,i)=>{
      const count=totalDays(i);const pct=Math.round((count/elapsed)*100);
      html+='<div class="ex-row"><span class="ex-name">'+name+'</span><span class="ex-val">'+count+' <span class="ex-pct">/ '+pct+'%</span></span></div>';
    });
    card.innerHTML=html;
    setTimeout(()=>{
      html2canvas(card,{backgroundColor:'#000000',scale:2,useCORS:true,logging:false}).then(canvas=>{
        const link=document.createElement('a');link.download='activity-'+currentUser+'-'+year+'.png';
        link.href=canvas.toDataURL('image/png');link.click();card.innerHTML='';
      });
    },100);
  }

  function switchTab(tab) {
    document.getElementById('v-activity').classList.toggle('active',tab==='activity');
    document.getElementById('v-stats').classList.toggle('active',tab==='stats');
    document.querySelectorAll('.nav-item').forEach(el=>{
      el.classList.toggle('active',(tab==='activity'&&el.textContent==='Activity')||(tab==='stats'&&el.textContent==='Stats'));
    });
    if(tab==='stats'){updateNotifLabel();renderStats();}
  }

  document.addEventListener('visibilitychange',()=>{
    if(!document.hidden&&currentUser){ensureDates();renderDayHeader();renderActivity();renderStats();updateDate();}
  });

  document.getElementById('auth-pin').addEventListener('keydown',e=>{if(e.key==='Enter')authSubmit();});
  document.getElementById('auth-username').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('auth-pin').focus();});

  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('/habits/sw.js').catch(err=>console.warn('SW:',err));
  }

  tryAutoLogin();
</script>
</body>
</html>
