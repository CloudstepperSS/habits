<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Activity">
<title>Activity</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  :root { --row-height: 72px; --side-pad: 24px; --font: 'Helvetica Neue', Helvetica, Arial, sans-serif; }
  html, body { width: 100%; height: 100%; background: #000; color: #fff; font-family: var(--font); overflow: hidden; }
  .app { display: flex; flex-direction: column; width: 100%; height: 100%; padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); background: #000; }
  .status-bar { display: flex; justify-content: space-between; align-items: center; padding: 14px var(--side-pad) 6px; flex-shrink: 0; }
  .status-time { font-size: 15px; font-weight: 600; letter-spacing: 0.01em; color: #fff; }
  .status-icons { font-size: 12px; color: #666; }
  .content { flex: 1; display: flex; flex-direction: column; padding: 0 var(--side-pad); overflow: hidden; }
  .view { display: none; flex-direction: column; flex: 1; }
  .view.active { display: flex; }

  .row { display: flex; align-items: center; height: var(--row-height); border-bottom: 0.5px solid #1a1a1a; flex-shrink: 0; }
  .row:last-child { border-bottom: none; }
  .row.nav-row { justify-content: space-between; border-color: #1c1c1c; }
  .row.habit-row { justify-content: space-between; }
  .row.stat-row { justify-content: space-between; }
  .row.edit-row { gap: 12px; }
  .row.add-row { justify-content: flex-start; cursor: pointer; }
  .row.export-row { justify-content: flex-start; cursor: pointer; margin-top: auto; border-top: 0.5px solid #1a1a1a; border-bottom: none; }

  .nav-item { font-size: 28px; font-weight: 700; letter-spacing: -0.02em; line-height: 1; color: #2a2a2a; cursor: pointer; user-select: none; }
  .nav-item.active { color: #fff; }

  .row-label { font-size: 28px; font-weight: 700; letter-spacing: -0.02em; line-height: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; cursor: pointer; }
  .habit-row.done .row-label { color: #2a2a2a; }
  .habit-row:not(.done) .row-label { color: #fff; }

  .pencil { font-size: 16px; color: #2a2a2a; cursor: pointer; user-select: none; padding: 10px 0 10px 14px; flex-shrink: 0; line-height: 1; }
  .pencil:active { color: #888; }

  .habit-tick { font-size: 18px; flex-shrink: 0; margin-left: 10px; cursor: pointer; }
  .habit-row.done .habit-tick { color: #2a2a2a; }
  .habit-row:not(.done) .habit-tick { color: #1e1e1e; }

  .add-label { font-size: 28px; font-weight: 700; letter-spacing: -0.02em; line-height: 1; color: #222; user-select: none; }
  .export-label { font-size: 28px; font-weight: 700; letter-spacing: -0.02em; line-height: 1; color: #2a2a2a; user-select: none; }
  .export-label:active { color: #555; }

  .stat-row .row-label { max-width: 55%; color: #fff; cursor: default; }
  .stat-val { font-size: 18px; font-weight: 600; color: #888; white-space: nowrap; letter-spacing: 0.01em; }
  .stat-val em { color: #444; font-style: normal; }

  .edit-input { flex: 1; background: none; border: none; border-bottom: 0.5px solid #555; color: #fff; font-family: var(--font); font-size: 28px; font-weight: 700; letter-spacing: -0.02em; outline: none; padding: 0; min-width: 0; }
  .edit-ok { font-size: 15px; color: #555; cursor: pointer; font-family: var(--font); font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; user-select: none; padding: 8px 0 8px 10px; flex-shrink: 0; }
  .edit-ok:active { color: #fff; }
  .edit-del { font-size: 15px; color: #3a1a1a; cursor: pointer; font-family: var(--font); font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; user-select: none; padding: 8px 0 8px 10px; flex-shrink: 0; }
  .edit-del:active { color: #c00; }

  .home-bar { height: 34px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
  .home-indicator { width: 134px; height: 5px; background: #333; border-radius: 3px; }

  #export-card {
    position: fixed; left: -9999px; top: 0; width: 750px;
    background: #000; padding: 80px 60px;
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
  }
  #export-card .ex-year { font-size: 22px; font-weight: 500; color: #444; letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 48px; }
  #export-card .ex-row { display: flex; justify-content: space-between; align-items: baseline; padding: 28px 0; border-bottom: 0.5px solid #1a1a1a; }
  #export-card .ex-row:last-child { border-bottom: none; }
  #export-card .ex-name { font-size: 48px; font-weight: 700; letter-spacing: -0.02em; color: #fff; }
  #export-card .ex-val { font-size: 28px; font-weight: 600; color: #888; letter-spacing: 0.02em; }
  #export-card .ex-pct { color: #444; }
</style>
</head>
<body>
<div class="app">
  <div class="status-bar">
    <span class="status-time" id="clk">9:41</span>
    <span class="status-icons">▲▲▲</span>
  </div>
  <div class="content">
    <div class="view active" id="v-activity">
      <div class="row nav-row">
        <span class="nav-item active" onclick="switchTab('activity')">Activity</span>
        <span class="nav-item" onclick="switchTab('stats')">Stats</span>
      </div>
      <div id="act-list"></div>
    </div>
    <div class="view" id="v-stats">
      <div class="row nav-row">
        <span class="nav-item" onclick="switchTab('activity')">Activity</span>
        <span class="nav-item active" onclick="switchTab('stats')">Stats</span>
      </div>
      <div id="stat-list"></div>
      <div class="row export-row" onclick="exportStats()">
        <span class="export-label">↓ Save as image</span>
      </div>
    </div>
  </div>
  <div class="home-bar"><div class="home-indicator"></div></div>
</div>

<div id="export-card"></div>

<script>
  const NAMES_KEY = 'activity_names_v3';
  const LOG_KEY   = 'activity_log_v3';
  const DEFAULT_NAMES = ['Gym', 'Nights out', 'Family', 'Abroad', 'Reading'];
  const MAX_HABITS = 10;
  const MIN_HABITS = 1;

  function todayStr() {
    const n = new Date();
    return n.getFullYear() + '-' +
      String(n.getMonth() + 1).padStart(2, '0') + '-' +
      String(n.getDate()).padStart(2, '0');
  }

  function daysElapsed() {
    const n = new Date();
    const jan1 = new Date(n.getFullYear(), 0, 1);
    return Math.floor((n - jan1) / 86400000) + 1;
  }

  function loadNames() {
    try { const r = localStorage.getItem(NAMES_KEY); if (r) return JSON.parse(r); } catch(e) {}
    return [...DEFAULT_NAMES];
  }
  function saveNames() { try { localStorage.setItem(NAMES_KEY, JSON.stringify(habitNames)); } catch(e) {} }

  function loadLog() {
    try { const r = localStorage.getItem(LOG_KEY); if (r) return JSON.parse(r); } catch(e) {}
    return {};
  }
  function saveLog() { try { localStorage.setItem(LOG_KEY, JSON.stringify(log)); } catch(e) {} }

  let habitNames = loadNames();
  let log = loadLog();
  const today = todayStr();

  function ensureToday() {
    const existing = log[today] || [];
    while (existing.length < habitNames.length) existing.push(false);
    log[today] = existing;
    saveLog();
  }
  ensureToday();

  let editingIdx = null;

  function totalDays(idx) {
    return Object.values(log).filter(e => Array.isArray(e) && e[idx] === true).length;
  }

  function deleteActivity(i) {
    if (habitNames.length <= MIN_HABITS) return;
    if (!confirm('Delete "' + habitNames[i] + '"? All logged data for this activity will be lost.')) return;
    habitNames.splice(i, 1);
    Object.keys(log).forEach(k => { if (Array.isArray(log[k])) log[k].splice(i, 1); });
    saveNames(); saveLog();
    editingIdx = null;
    renderActivity(); renderStats();
  }

  function addActivity() {
    if (habitNames.length >= MAX_HABITS) return;
    habitNames.push('New activity');
    saveNames();
    Object.keys(log).forEach(k => {
      if (Array.isArray(log[k])) log[k].push(false);
    });
    saveLog();
    editingIdx = habitNames.length - 1;
    renderActivity(); renderStats();
  }

  function renderActivity() {
    ensureToday();
    const entry = log[today];
    const list = document.getElementById('act-list');
    list.innerHTML = '';

    habitNames.forEach((name, i) => {
      if (editingIdx === i) {
        const row = document.createElement('div');
        row.className = 'row edit-row';

        const inp = document.createElement('input');
        inp.className = 'edit-input';
        inp.value = name === 'New activity' ? '' : name;
        inp.maxLength = 16;
        inp.setAttribute('autocomplete', 'off');
        inp.setAttribute('autocorrect', 'off');
        inp.setAttribute('autocapitalize', 'words');

        const confirm = () => {
          const v = inp.value.trim();
          if (v) {
            habitNames[i] = v;
          } else if (name === 'New activity') {
            habitNames.splice(i, 1);
            Object.keys(log).forEach(k => { if (Array.isArray(log[k])) log[k].splice(i, 1); });
            saveLog();
          }
          saveNames(); editingIdx = null;
          renderActivity(); renderStats();
        };

        inp.onkeydown = e => {
          if (e.key === 'Enter') { inp.blur(); confirm(); }
          if (e.key === 'Escape') { editingIdx = null; renderActivity(); }
        };

        const ok = document.createElement('span');
        ok.className = 'edit-ok'; ok.textContent = 'OK';
        ok.onclick = confirm;

        // Delete button — only if more than minimum
        const del = document.createElement('span');
        del.className = 'edit-del'; del.textContent = 'DEL';
        del.onclick = () => deleteActivity(i);

        row.appendChild(inp);
        row.appendChild(ok);
        if (habitNames.length > MIN_HABITS) row.appendChild(del);
        list.appendChild(row);
        setTimeout(() => { inp.focus(); inp.select(); }, 20);
        return;
      }

      const done = entry[i] || false;
      const row = document.createElement('div');
      row.className = 'row habit-row' + (done ? ' done' : '');

      const label = document.createElement('span');
      label.className = 'row-label';
      label.textContent = name;
      label.onclick = () => { log[today][i] = !log[today][i]; saveLog(); renderActivity(); renderStats(); };

      const pencil = document.createElement('span');
      pencil.className = 'pencil';
      pencil.textContent = '✎';
      pencil.onclick = (e) => { e.stopPropagation(); editingIdx = i; renderActivity(); };

      const tick = document.createElement('span');
      tick.className = 'habit-tick';
      tick.textContent = done ? '■' : '□';
      tick.onclick = () => { log[today][i] = !log[today][i]; saveLog(); renderActivity(); renderStats(); };

      row.appendChild(label); row.appendChild(pencil); row.appendChild(tick);
      list.appendChild(row);
    });

    if (habitNames.length < MAX_HABITS) {
      const addRow = document.createElement('div');
      addRow.className = 'row add-row';
      const addLabel = document.createElement('span');
      addLabel.className = 'add-label';
      addLabel.textContent = '+ Add activity';
      addRow.onclick = addActivity;
      addRow.appendChild(addLabel);
      list.appendChild(addRow);
    }
  }

  function renderStats() {
    const elapsed = daysElapsed();
    const list = document.getElementById('stat-list');
    list.innerHTML = '';
    habitNames.forEach((name, i) => {
      const count = totalDays(i);
      const pct = Math.round((count / elapsed) * 100);
      const row = document.createElement('div');
      row.className = 'row stat-row';
      row.innerHTML = '<span class="row-label">' + name + '</span><span class="stat-val">' + count + ' <em>/ ' + pct + '%</em></span>';
      list.appendChild(row);
    });
  }

  function exportStats() {
    const elapsed = daysElapsed();
    const year = new Date().getFullYear();
    const card = document.getElementById('export-card');
    let html = '<div class="ex-year">' + year + '</div>';
    habitNames.forEach((name, i) => {
      const count = totalDays(i);
      const pct = Math.round((count / elapsed) * 100);
      html += '<div class="ex-row"><span class="ex-name">' + name + '</span><span class="ex-val">' + count + ' <span class="ex-pct">/ ' + pct + '%</span></span></div>';
    });
    card.innerHTML = html;
    setTimeout(() => {
      html2canvas(card, { backgroundColor: '#000000', scale: 2, useCORS: true, logging: false }).then(canvas => {
        const link = document.createElement('a');
        link.download = 'activity-' + year + '.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
        card.innerHTML = '';
      });
    }, 100);
  }

  function switchTab(tab) {
    document.getElementById('v-activity').classList.toggle('active', tab === 'activity');
    document.getElementById('v-stats').classList.toggle('active', tab === 'stats');
    document.querySelectorAll('.nav-item').forEach(el => {
      el.classList.toggle('active',
        (tab === 'activity' && el.textContent === 'Activity') ||
        (tab === 'stats' && el.textContent === 'Stats')
      );
    });
  }

  function updateClock() {
    const n = new Date();
    document.getElementById('clk').textContent =
      n.getHours() + ':' + n.getMinutes().toString().padStart(2, '0');
  }
  updateClock(); setInterval(updateClock, 15000);

  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) { ensureToday(); renderActivity(); renderStats(); updateClock(); }
  });

  renderActivity(); renderStats();
</script>
</body>
</html>
